<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뷰티 키워드 인텔리전스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --sunk:#EDEFF3; --line:#E4E7EC; --line2:#EFF1F4;
  --ink:#0F1115; --ink2:#565E6E; --ink3:#8B93A3;
  --good:#12715C; --goodbg:#E4F3EE; --info:#2F58A6; --infobg:#E7EDF9;
  --warn:#9A6414; --warnbg:#F8EEDC; --bad:#A5372F; --badbg:#F9E7E4;
  --shadow:0 1px 2px rgba(16,20,28,.05), 0 6px 20px -8px rgba(16,20,28,.10);
  --kr:'IBM Plex Sans KR',system-ui,sans-serif; --mono:'Space Grotesk',var(--kr);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C0E12; --surface:#14171D; --sunk:#1B1F26; --line:#242932; --line2:#1E222A;
  --ink:#EEF0F4; --ink2:#A4ABBA; --ink3:#6E7688;
  --good:#54C6A5; --goodbg:#11302A; --info:#8AA8EE; --infobg:#182238;
  --warn:#E0A94F; --warnbg:#332616; --bad:#E58479; --badbg:#35201D;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -10px rgba(0,0,0,.6);}}
:root[data-theme="dark"]{
  --bg:#0C0E12; --surface:#14171D; --sunk:#1B1F26; --line:#242932; --line2:#1E222A;
  --ink:#EEF0F4; --ink2:#A4ABBA; --ink3:#6E7688;
  --good:#54C6A5; --goodbg:#11302A; --info:#8AA8EE; --infobg:#182238;
  --warn:#E0A94F; --warnbg:#332616; --bad:#E58479; --badbg:#35201D;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -10px rgba(0,0,0,.6);}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--kr);font-size:15px;
  line-height:1.6;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.022em;line-height:1.25}
.n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* header */
header{padding:44px 0 26px}
h1{font-size:27px;font-weight:600}
.sub{margin:8px 0 0;color:var(--ink2);font-size:15px;max-width:58ch}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}
.chip{font-size:12px;color:var(--ink2);background:var(--surface);border:1px solid var(--line);
  padding:4px 11px;border-radius:99px}

/* sticky nav — 카테고리 선택 */
.navbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
nav{display:flex;gap:7px;align-items:center;flex-wrap:wrap;max-width:1160px;margin:0 auto;padding:11px 24px}
nav .navlab{font-size:12.5px;color:var(--ink2);white-space:nowrap;margin-right:6px;font-weight:600;
  display:flex;align-items:center;gap:6px;width:100%;margin-bottom:2px}
nav .navlab svg{width:14px;height:14px;stroke:var(--ink2);fill:none;stroke-width:2}
nav .navlab em{font-style:normal;font-weight:400;color:var(--ink3);font-size:11.5px}
nav button{appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:9px;
  font-family:var(--kr);font-size:14px;font-weight:500;color:var(--ink2);
  padding:8px 14px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px;
  transition:border-color .13s,color .13s,background .13s}
nav button:hover{color:var(--ink);border-color:var(--ink3)}
nav button[aria-selected="true"]{color:var(--surface);background:var(--ink);border-color:var(--ink);font-weight:600}
nav button:focus-visible{outline:2px solid var(--info);outline-offset:2px}
nav button i{font-style:normal;font-family:var(--mono);font-size:11.5px;font-weight:600;
  color:var(--ink3);background:var(--sunk);border-radius:99px;padding:1px 6px}
nav button[aria-selected="true"] i{color:var(--ink);background:var(--bg)}

/* 가로 스크롤 안내 */
.ovfwrap{position:relative}
.ovfwrap.ovf::after{content:"";position:absolute;top:0;right:0;bottom:0;width:56px;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--surface) 78%);border-radius:0 13px 13px 0;z-index:3}
.ovfhint{display:none;align-items:center;gap:6px;font-size:12px;color:var(--ink3);
  margin:0 0 8px;font-family:var(--kr)}
.ovfwrap.ovf + .ovfhint,.ovfhint.on{display:flex}
.ovfhint b{font-family:var(--mono);color:var(--ink2);font-weight:600}
.ovfhint svg{width:13px;height:13px;stroke:var(--ink3);fill:none;stroke-width:2}
/* section */
section{margin-top:44px;scroll-margin-top:60px}
.sh{margin-bottom:18px}
.sh h2{font-size:19px;display:flex;align-items:baseline;gap:9px}
.sh h2 span{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ink3)}
.sh p{margin:5px 0 0;font-size:13.5px;color:var(--ink3)}
.lead{font-size:14.5px;color:var(--ink2);line-height:1.68;margin:0 0 18px;max-width:78ch}
.lead b{color:var(--ink);font-weight:600}
.note{font-size:13.5px;color:var(--ink3);line-height:1.68;margin:18px 0 0;max-width:78ch}
.note b{color:var(--ink2);font-weight:500}

/* cards grid — 카테고리 비교 */
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px 18px;
  box-shadow:var(--shadow);cursor:pointer;text-align:left;font-family:var(--kr);color:var(--ink);
  width:100%;display:block;transition:border-color .13s,transform .13s,box-shadow .13s}
.cc:hover{border-color:var(--ink3);transform:translateY(-2px);
  box-shadow:0 2px 4px rgba(16,20,28,.06),0 12px 28px -10px rgba(16,20,28,.18)}
.cc:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.cc[aria-current="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink),var(--shadow)}
.cc .go{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;
  padding-top:13px;border-top:1px solid var(--line2);font-size:12.5px;font-weight:600;color:var(--info)}
.cc .go .cur{font-size:11.5px;font-weight:500;color:var(--ink3)}
.cc[aria-current="true"] .go{color:var(--ink)}
.cc.lead-pick{border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.cc-t{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.cc-t h4{font-size:16.5px}
.cc dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:9px 12px;font-size:13px}
.cc dt{color:var(--ink3)}
.cc dd{margin:0;text-align:right;font-family:var(--mono);font-weight:600;font-size:14px}
.cc dd.g{color:var(--good)} .cc dd.b{color:var(--bad)}
.cc p{font-size:13px;line-height:1.62;color:var(--ink2);margin:14px 0 0;padding-top:13px;
  border-top:1px solid var(--line2)}

/* pill */
.pill{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap;
  letter-spacing:0}
.pill.good{background:var(--goodbg);color:var(--good)}
.pill.ok{background:var(--infobg);color:var(--info)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.none{background:var(--sunk);color:var(--ink3)}

/* kpi */
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(124px,1fr));gap:10px}
.kp{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 15px}
.kp dt{font-size:12px;color:var(--ink3);margin:0 0 5px}
.kp dd{margin:0;font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.05;
  letter-spacing:-.02em}
.kp dd small{font-family:var(--kr);font-size:12.5px;font-weight:400;color:var(--ink3);margin-left:2px}

/* map */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);position:relative;padding:8px}
svg.chart{display:block;width:100%;height:auto;border-radius:8px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:13px;font-size:12.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);
  padding:10px 13px;font-size:12.5px;line-height:1.55;max-width:250px;opacity:0;
  transition:opacity .1s;z-index:9;border-radius:9px;box-shadow:0 10px 30px -8px rgba(0,0,0,.45)}
.tip b{font-size:13.5px;display:block;margin-bottom:4px}
.dot{cursor:pointer}

/* axis cards */
.ax{display:flex;flex-direction:column;gap:11px}
.axc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;
  box-shadow:var(--shadow);display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start}
.axc.dim{opacity:.6;box-shadow:none}
.axc-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:8px}
.axc-h h4{font-size:16.5px}
.axc-h .c{font-size:12px;color:var(--ink3);font-family:var(--mono)}
.say{font-size:14px;line-height:1.66;margin:0 0 11px;max-width:58ch}
.say b{font-weight:600}
.ex{font-size:12.5px;color:var(--ink3);line-height:1.8;margin:0}
.ex b{color:var(--ink2);font-weight:500;margin-right:4px}
.axm{background:var(--sunk);border-radius:11px;padding:14px 16px}
.bar{background:color-mix(in srgb,var(--ink) 8%,transparent);height:6px;border-radius:99px;
  overflow:hidden;margin-bottom:5px}
.bar i{display:block;height:100%;background:var(--info);border-radius:99px}
.bar i.good{background:var(--good)} .bar i.bad{background:var(--bad)}
.barlab{font-size:11.5px;color:var(--ink3);font-family:var(--mono);margin-bottom:13px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px 8px}
.mgrid div{font-size:11.5px;color:var(--ink3);line-height:1.3}
.mgrid b{display:block;font-family:var(--mono);font-size:16px;font-weight:600;color:var(--ink);
  letter-spacing:-.02em}
.mgrid b.g{color:var(--good)} .mgrid b.b{color:var(--bad)}

/* split */
.split{margin:14px 0 0;padding-top:13px;border-top:1px dashed var(--line)}
.split-h{font-size:11.5px;color:var(--ink3);margin:0 0 8px}
.sp{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;
  padding:8px 11px;border-radius:9px;background:var(--sunk);margin-bottom:5px}
.sp:last-child{margin-bottom:0}
.sp-n{font-size:13px;font-weight:500}
.sp-e{font-size:11.5px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-c{font-family:var(--mono);font-size:15px;font-weight:600;white-space:nowrap}
.sp-c small{font-family:var(--kr);font-weight:400;font-size:11px;color:var(--ink3);margin-left:5px}
.sp-c.g{color:var(--good)} .sp-c.b{color:var(--bad)}

/* 05 경로 리스트 — 단일 표 */
.pbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:11px}
.plab{font-size:12px;color:var(--ink3);white-space:nowrap;margin-right:2px}
.psegs{display:flex;gap:7px;flex-wrap:wrap}
.psegs button{appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  font-family:var(--kr);font-size:14.5px;font-weight:500;color:var(--ink2);padding:9px 16px;
  cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px;
  transition:border-color .13s,color .13s,background .13s}
.psegs button:hover{color:var(--ink);border-color:var(--ink3)}
.psegs button[aria-pressed="true"]{color:var(--surface);background:var(--ink);border-color:var(--ink);
  font-weight:600}
.psegs button:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.psegs button i{font-style:normal;font-family:var(--mono);font-size:12px;font-weight:600;
  color:var(--ink3);background:var(--sunk);border-radius:99px;padding:1px 7px}
.psegs button[aria-pressed="true"] i{color:var(--ink);background:var(--bg)}
.pgate{font-family:var(--mono);font-size:11.5px;color:var(--ink3);background:var(--sunk);
  border-radius:7px;padding:6px 11px;margin-left:auto}
.prole{font-size:13.2px;color:var(--ink2);margin:0 0 13px;line-height:1.62}
.prole b{font-weight:600;color:var(--ink)}
.pt{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:var(--shadow)}
.pscroll{overflow-x:auto}
.pt table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px;min-width:780px}
.pt th{text-align:right;font-weight:500;font-size:11.5px;color:var(--ink3);padding:10px 13px;
  background:var(--surface);white-space:nowrap;border-bottom:1px solid var(--line)}
.pt th:first-child,.pt td:first-child{text-align:left;padding-left:17px}
.pt th:last-child,.pt td:last-child{padding-right:17px;text-align:left}
.pt td{padding:9px 13px;border-bottom:1px solid var(--line2);text-align:right;
  font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pt tbody tr:last-child td{border-bottom:0}
.pt tbody tr:hover td{background:var(--sunk)}
.pt .k{font-family:var(--kr);font-weight:500;font-size:14px;text-align:left}
.pt .nd{font-family:var(--kr);font-size:12px;color:var(--ink3);text-align:left}
.pt td.hi{font-weight:600;color:var(--ink)}
.route{display:inline-flex;gap:3px;margin-left:7px;vertical-align:1px}
.route b{font-family:var(--mono);font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:4px}
.route b.m{background:var(--infobg);color:var(--info)}
.route b.o{background:var(--goodbg);color:var(--good)}
.route b.a{background:var(--warnbg);color:var(--warn)}
.pempty{padding:28px 17px;color:var(--ink3);font-size:13.5px;line-height:1.65}



/* 01 카테고리 표 */
.ctab{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.ctab .hd,.crow{display:grid;grid-template-columns:132px 150px 96px 74px 66px 62px 92px 24px;gap:12px;align-items:center}
.ctab .hd{padding:11px 16px;font-size:11.5px;color:var(--ink3);border-bottom:1px solid var(--line)}
.ctab .hd div:nth-child(n+3){text-align:right}
.ctab .hd div:last-child,.ctab .hd div:nth-child(7){text-align:left}
.crow{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line2);
  padding:11px 16px;cursor:pointer;font-family:var(--kr);color:var(--ink);transition:background .12s}
.crow:last-child{border-bottom:0}
.crow:hover{background:var(--sunk)}
.crow[aria-current="true"]{background:var(--sunk);box-shadow:inset 3px 0 0 var(--ink)}
.crow:focus-visible{outline:2px solid var(--info);outline-offset:-2px}
.cname{font-size:14.5px;font-weight:600}
.cval{text-align:right;font-family:var(--mono);font-size:13.5px;font-variant-numeric:tabular-nums}
.cval.g{color:var(--good)} .cval.b{color:var(--bad)}
.crow .stack{height:16px;margin:0;border-radius:6px}
.crow .chev{color:var(--ink3);font-size:11px;text-align:center}
@media (max-width:900px){
  .ctab .hd{display:none}
  .crow{grid-template-columns:1fr 70px 60px 20px;gap:9px}
  .crow > :nth-child(2),.crow > :nth-child(5),.crow > :nth-child(6){display:none}
}

/* 걸러낸 것 — 구성 막대 · 규제 · 인증 */
.stack{display:flex;height:30px;border-radius:9px;overflow:hidden;background:var(--sunk);margin:4px 0 10px}
.stack i{display:block;height:100%;position:relative}
.stack i:not(:last-child){box-shadow:inset -2px 0 0 var(--surface)}
.skey{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink2)}
.skey span{display:inline-flex;align-items:center;gap:6px}
.skey i{width:9px;height:9px;border-radius:3px}
.skey b{font-family:var(--mono);font-weight:600;color:var(--ink)}
.L-ok{background:var(--good)} .L-lock{background:var(--warn)} .L-ban{background:#C9791B}
.L-reg{background:var(--bad)} .L-svc{background:#7A5AA8} .L-brand{background:color-mix(in srgb,var(--ink3) 55%,transparent)} .L-typo{background:var(--info)}
.mini-stack{display:flex;height:7px;border-radius:99px;overflow:hidden;background:var(--sunk);margin:2px 0 4px}
.mini-stack i{display:block;height:100%}
.cc .mslab{font-size:11.5px;color:var(--ink3);margin:0 0 12px;font-family:var(--mono)}
.gate3{display:grid;grid-template-columns:1.1fr 1fr;gap:12px;margin-top:16px}
.gbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:17px 19px;box-shadow:var(--shadow)}
.gbox h3{font-size:15.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gbox .role{font-size:12.5px;color:var(--ink3);margin:5px 0 12px;line-height:1.6}
.gbox table{width:100%;border-collapse:collapse;font-size:13px}
.gbox th{text-align:right;font-weight:500;font-size:11px;color:var(--ink3);padding:0 0 7px;border-bottom:1px solid var(--line)}
.gbox th:first-child,.gbox td:first-child{text-align:left}
.gbox td{text-align:right;padding:7px 0;border-bottom:1px solid var(--line2);font-family:var(--mono);font-variant-numeric:tabular-nums}
.gbox td:first-child{font-family:var(--kr);font-weight:500}
.gbox tr:last-child td{border-bottom:0}
.gbox td .t{font-family:var(--kr);font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:4px;
  background:var(--badbg);color:var(--bad);margin-left:6px}
.gbox td .ty{font-family:var(--kr);font-size:10.5px;color:var(--info);margin-left:5px}
.gbox td.z{color:var(--bad);font-weight:600}
.lockhead{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.lockhead div{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:11.5px;color:var(--ink3)}
.lockhead b{display:block;font-family:var(--mono);font-size:17px;font-weight:600;color:var(--ink);margin-top:2px}
.lockhead b.w{color:var(--warn)}
.chips2{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips2 span{font-size:12.5px;background:var(--sunk);border-radius:7px;padding:4px 9px;color:var(--ink2)}
.chips2 span b{font-family:var(--mono);font-weight:600;color:var(--ink);margin-left:4px;font-size:12px}
.gnote{font-size:12.5px;color:var(--ink3);margin:12px 0 0;line-height:1.65}
.gnote b{color:var(--ink2);font-weight:600}

/* table */
.tbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
.search{position:relative;flex:1;min-width:200px;max-width:320px}
.search input{width:100%;font-family:var(--kr);font-size:13.5px;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:8px 32px 8px 34px;outline:none;transition:border-color .13s,box-shadow .13s}
.search input::placeholder{color:var(--ink3)}
.search input:focus{border-color:var(--info);box-shadow:0 0 0 3px color-mix(in srgb,var(--info) 14%,transparent)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  width:14px;height:14px;stroke:var(--ink3);fill:none;stroke-width:2;pointer-events:none}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);appearance:none;
  background:none;border:0;color:var(--ink3);cursor:pointer;font-size:16px;line-height:1;
  padding:4px 6px;border-radius:6px;display:none}
.search .clr:hover{background:var(--sunk);color:var(--ink)}
.search.has .clr{display:block}
.segs{display:flex;gap:3px;background:var(--sunk);padding:3px;border-radius:10px}
.segs button{appearance:none;background:none;border:0;border-radius:7px;color:var(--ink3);
  font-family:var(--kr);font-size:12.5px;font-weight:500;padding:6px 11px;cursor:pointer;

.segs button:hover{color:var(--ink2)}
.segs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.segs button:focus-visible{outline:2px solid var(--info);outline-offset:1px}
.cnt{font-size:12.5px;color:var(--ink3);font-family:var(--mono);margin-left:auto}
.tw{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;

.ts{overflow:auto;max-height:600px}
table.kt{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px;min-width:800px}
.kt th{text-align:right;font-weight:500;font-size:12px;color:var(--ink3);padding:11px 14px;

.kt th:hover{color:var(--ink)}
.kt th:first-child,.kt td:first-child{text-align:left;padding-left:18px}
.kt th:last-child,.kt td:last-child{padding-right:18px}
.kt th[data-a]::after{content:"";opacity:0}
.kt th.up::after{content:" ↑";opacity:1;color:var(--ink)}
.kt th.down::after{content:" ↓";opacity:1;color:var(--ink)}
.kt td{padding:10px 14px;border-bottom:1px solid var(--line2);text-align:right;

.kt tbody tr:last-child td{border-bottom:0}
.kt tbody tr:hover td{background:var(--sunk)}
.kt .kw{font-family:var(--kr);font-weight:500;font-size:14px}
.kt .kw mark{background:color-mix(in srgb,var(--info) 22%,transparent);color:inherit;
  border-radius:3px;padding:0 1px}
.kt .tag{font-family:var(--kr);color:var(--ink3);font-size:12.5px;text-align:left}
.qd{font-family:var(--mono);font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:6px}
.qB{background:var(--goodbg);color:var(--good)} .qA{background:var(--warnbg);color:var(--warn)}
.qC{background:var(--infobg);color:var(--info)} .qD{background:var(--badbg);color:var(--bad)}
.empty{padding:34px 18px;text-align:center;color:var(--ink3);font-size:13.5px}

/* insight */
.verdict{font-size:15.5px;font-weight:500;line-height:1.62;padding:16px 20px;border-radius:12px;
  background:var(--goodbg);color:var(--good);margin-bottom:14px}
.verdict.warn{background:var(--badbg);color:var(--bad)}
.two-ins{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ic{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px 8px;
  box-shadow:var(--shadow)}
.ic h3{font-size:16px}
.ic .role{font-size:12.5px;color:var(--ink3);margin:4px 0 14px}
.ic ul{margin:0;padding:0;list-style:none}
.ic li{padding:12px 0;border-bottom:1px solid var(--line2);font-size:13.8px;line-height:1.62}
.ic li:last-child{border-bottom:0}
.ic li em{display:block;font-style:normal;font-family:var(--mono);color:var(--ink3);
  font-size:12px;margin-top:5px}

/* caveat */
details.cav{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);overflow:hidden}
details.cav summary{padding:16px 20px;cursor:pointer;font-weight:600;font-size:15px;
  list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px}
details.cav summary::-webkit-details-marker{display:none}
details.cav summary::after{content:"＋";color:var(--ink3);font-weight:400}
details.cav[open] summary::after{content:"－"}
details.cav summary:hover{background:var(--sunk)}
.cavbody{padding:0 20px 18px}
.cavbody ol{margin:0;padding-left:19px;font-size:13.5px;color:var(--ink2);line-height:1.72}
.cavbody li{margin-bottom:10px} .cavbody li:last-child{margin-bottom:0}
.cavbody b{color:var(--ink);font-weight:600}
.formula{font-size:12.5px;color:var(--ink3);margin-top:15px;padding-top:13px;
  border-top:1px solid var(--line2);line-height:1.7}
footer{margin:44px 0 60px;padding-top:18px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--ink3);display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}

@media (max-width:900px){
  .wrap{padding:0 16px}
  .cmp,.two-ins,.gate3{grid-template-columns:1fr}

  nav{padding:9px 16px}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- 03 시장 지도 ---------- */
function drawMap(d){
  const W=980,H=470,L=58,R=22,T=22,B=44;
  const rows=d.rows,iw=W-L-R,ih=H-T-B;
  const lg=v=>Math.log10(Math.max(v,0.01));
  const xs=rows.map(r=>lg(r.s)),ys=rows.map(r=>lg(r.ci));
  const x0=Math.min(...xs)-.12,x1=Math.max(...xs)+.12;
  const y0=Math.min(...ys)-.15,y1=Math.max(...ys)+.15;
  const X=v=>L+(lg(v)-x0)/(x1-x0)*iw, Y=v=>T+ih-(lg(v)-y0)/(y1-y0)*ih;
  const mx=X(d.sum.medS),my=Y(d.sum.medC);
  const mc=Math.max(...rows.map(r=>r.mctr))||1;
  const rad=v=>3.4+Math.sqrt(v/mc)*8.5;
  const C={A:'var(--warn)',B:'var(--good)',C:'var(--info)',D:'var(--bad)'};
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="검색량 대비 경쟁강도 분포">`;
  s+=`<rect x="${mx}" y="${my}" width="${L+iw-mx}" height="${T+ih-my}" rx="8" fill="var(--good)" opacity=".07"/>`;
  for(let e=Math.ceil(x0);e<=x1;e++){const px=X(Math.pow(10,e));
    s+=`<line x1="${px}" y1="${T}" x2="${px}" y2="${T+ih}" stroke="var(--line2)"/>
    <text x="${px}" y="${T+ih+17}" fill="var(--ink3)" font-size="10.5" text-anchor="middle" font-family="Space Grotesk">${fmt(Math.pow(10,e))}</text>`;}
  for(let e=Math.ceil(y0);e<=y1;e++){const py=Y(Math.pow(10,e)),vv=Math.pow(10,e);
    s+=`<line x1="${L}" y1="${py}" x2="${L+iw}" y2="${py}" stroke="var(--line2)"/>
    <text x="${L-9}" y="${py+4}" fill="var(--ink3)" font-size="10.5" text-anchor="end" font-family="Space Grotesk">${vv<1?vv.toFixed(1):fmt(vv)}</text>`;}
  s+=`<line x1="${mx}" y1="${T}" x2="${mx}" y2="${T+ih}" stroke="var(--ink3)" stroke-dasharray="2 5" opacity=".6"/>
      <line x1="${L}" y1="${my}" x2="${L+iw}" y2="${my}" stroke="var(--ink3)" stroke-dasharray="2 5" opacity=".6"/>`;
  const ql=(x,y,t,a)=>`<text x="${x}" y="${y}" fill="var(--ink3)" font-size="11" text-anchor="${a}">${t}</text>`;
  s+=ql(L+8,T+15,'수요 적고 경쟁 심함','start')+ql(L+iw-8,T+15,'수요 크고 경쟁 심함','end')
    +ql(L+8,T+ih-8,'니치','start')+ql(L+iw-8,T+ih-8,'수요 있고 경쟁 낮음 — 목표 구간','end');
  rows.slice().sort((a,b)=>b.s-a.s).forEach(r=>{
    s+=`<circle class="dot" cx="${X(r.s).toFixed(1)}" cy="${Y(r.ci).toFixed(1)}" r="${rad(r.mctr).toFixed(1)}"
      fill="${C[r.q]}" fill-opacity="${r.q==='B'?.55:.26}" stroke="${C[r.q]}" stroke-opacity=".8" stroke-width="1.1"
      data-k="${r.kw}" data-s="${fmt(r.s)}" data-c="${r.ci}" data-m="${r.mctr}" data-p="${fmt(r.p)}"
      data-a="${fmt(r.cpc)}" data-q="${QN[r.q]}" data-n="${r.nd.join(' · ')}"/>`;});
  d.rows.filter(r=>r.q==='B').sort((a,b)=>b.sc-a.sc).slice(0,6).forEach(r=>{
    const px=X(r.s),py=Y(r.ci),fl=px>W-180;
    s+=`<text x="${(fl?px-rad(r.mctr)-6:px+rad(r.mctr)+6).toFixed(1)}" y="${(py+4).toFixed(1)}"
      fill="var(--ink)" font-size="12" font-weight="500" text-anchor="${fl?'end':'start'}">${r.kw}</text>`;});
  s+=`<text x="${L+iw}" y="${H-5}" fill="var(--ink3)" font-size="11" text-anchor="end">한 달 검색량 →</text>
      <text x="${L-9}" y="${T-7}" fill="var(--ink3)" font-size="11" text-anchor="end">↑ 경쟁강도</text></svg>`;
  return s;
}

/* ---------- 06 표 + 검색 ---------- */
const esc = s => s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function hl(text,term){
  if(!term) return esc(text);
  const i=text.toLowerCase().indexOf(term.toLowerCase());
  if(i<0) return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+term.length))+'</mark>'+esc(text.slice(i+term.length));
}
function filtered(d){
  let r = qf==='ALL' ? d.rows.slice() : d.rows.filter(x=>x.q===qf);
  const t=q.trim().toLowerCase();
  if(t) r=r.filter(x=>x.kw.toLowerCase().includes(t)||x.cl.toLowerCase().includes(t)
    ||x.nd.some(n=>n.toLowerCase().includes(t)));
  r.sort((a,b)=>{const x=a[sk],y=b[sk];
    return (typeof x==='string'?x.localeCompare(y,'ko'):x-y)*sd;});
  return r;
}
function tableBody(d){
  const rows=filtered(d);
  if(!rows.length) return `<div class="empty">${q?`&ldquo;${esc(q)}&rdquo;에 해당하는 키워드가 없습니다.`:'이 구간에 해당하는 키워드가 없습니다.'}</div>`;
  const mx=Math.max(...rows.map(r=>r.s),1);
  const cols=[['kw','키워드'],['s','검색량'],['p','상품수'],['ci','경쟁강도'],['mctr','모바일 CTR'],['cpc','광고단가'],['cl','컨셉'],['sc','기회점수']];
  let h='<div class="tw ovfwrap" id="twrap"><div class="ts"><table class="kt"><thead><tr>';
  cols.forEach(([k,l])=>h+=`<th data-s="${k}" data-a class="${sk===k?(sd>0?'up':'down'):''}">${l}</th>`);
  h+='</tr></thead><tbody>';
  rows.forEach(r=>h+=`<tr><td class="kw">${hl(r.kw,q.trim())}</td>
    <td>${fmt(r.s)}</td><td>${fmt(r.p)}</td>
    <td><span class="qd q${r.q}">${r.ci}</span></td>
    <td>${r.mctr.toFixed(2)}%</td><td>${fmt(r.cpc)}</td>
    <td class="tag">${r.cl}</td><td>${r.sc.toFixed(2)}</td></tr>`);
  return h+'</tbody></table></div></div>';
}
function refreshTable(){
  const d=DATA[cur];
  document.getElementById('tbody').innerHTML=tableBody(d);
  if(window.__checkOvf) setTimeout(window.__checkOvf,0);
  document.getElementById('tcnt').textContent=`${filtered(d).length} / ${d.rows.length}개`;
  bindSort();
}
function bindSort(){
  document.querySelectorAll('.kt th[data-s]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.s;
    if(sk===k) sd*=-1; else {sk=k; sd=(k==='kw'||k==='cl')?1:-1;}
    refreshTable();});
}

      <div class="kp"><dt>광고단가 중앙값</dt><dd>${fmt(d.sum.cpc)}<small>원</small></dd></div>
      <div class="kp"><dt>모바일 검색</dt><dd>${d.sum.mob}<small>%</small></dd></div>
      <div class="kp"><dt>상위 20개 집중도</dt><dd>${d.sum.top20}<small>%</small></dd></div>
    </dl>
  </section>

  <section>
    <div class="sh"><h2><span>03</span>먼저 걸러낸 것</h2>
      <p>이 카테고리 전체 검색을 진입 가능 여부로 나눈 결과</p></div>
    ${gateSection(d)}
  </section>

  <section>
    <div class="sh"><h2><span>04</span>시장 지도</h2>
      <p>점 크기는 모바일 클릭률 · 점선은 이 카테고리 중앙값</p></div>
    <div class="panel" id="mapbox">${drawMap(d)}<div class="tip" id="tip"></div></div>
    <div class="legend">
      <span><i style="background:var(--good)"></i>기회 ${d.sum.qB}</span>
      <span><i style="background:var(--warn)"></i>대시장·고경쟁 ${d.sum.qA}</span>
      <span><i style="background:var(--info)"></i>니치 ${d.sum.qC}</span>
      <span><i style="background:var(--bad)"></i>회피 ${d.sum.qD}</span>
    </div>
  </section>

  <section>
    <div class="sh"><h2><span>05</span>어떤 컨셉으로 제품을 기획할 것인가</h2>
      <p>진입 가능 키워드를 고민 · 성분 · 제형 · 대상 · 용도로 분류</p></div>
    <p class="lead">${d.lead}</p>
    ${axCards(d.cards)}
    <p class="note">자체 브랜드의 제품 컨셉은 보통 <b>고민 하나 + 성분 하나 + 제형 하나</b>의 조합입니다. 사람들은 검색할 때 조건을 하나만 붙이므로 조합 자체의 경쟁강도는 잴 수 없지만, 각 축에서 비어 있는 것끼리 묶으면 겹치는 경쟁이 적은 컨셉이 됩니다. 성분·제형·대상·용도는 하위 항목이 많아 하나의 카드로 묶고, 카드 안에서 항목별 경쟁강도를 보여줍니다.</p>
  </section>

  <section>
    <div class="sh"><h2><span>06</span>진입 경로별 키워드</h2>
      <p>시장이 열려 있는 곳 · 광고 없이 뚫는 곳 · 광고로 사는 곳</p></div>
    <p class="lead">진입로는 둘입니다. <b>오가닉</b>은 등록 상품이 적어야 뚫리고, <b>광고</b>는 상품이 아무리 많아도 입찰가만 낮으면 들어갑니다. 상품수만 보면 광고로 열려 있는 자리를 통째로 놓칩니다. 여러 경로에 걸린 키워드는 이름 옆에 배지로 표시했습니다.</p>
    <div class="pbar">
      <span class="plab">진입 경로</span>
      <div class="psegs" id="psegs">${['md','org','ad'].map(x=>`<button data-p="${x}" aria-pressed="${pv===x}">${PATH[x].label}<i>${(d[x]||[]).length}</i></button>`).join('')}</div>
      <span class="pgate" id="pgate"></span>
    </div>
    <p class="prole" id="prole"></p>
    <p class="ovfhint" id="phint"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>표를 <b>옆으로 밀면</b> 경쟁강도 · CTR · CPC · 니즈가 더 있습니다</p>
    <div id="ptable"></div>
    <p class="note">세 경로는 <b>실행 주체가 다릅니다.</b> MD 우선은 발주 회의에서, 오가닉 진입은 상품 등록 화면에서, 광고 진입은 광고 계정에서 씁니다. 배지가 둘 이상 붙은 키워드는 상품도 적고 광고도 싼 자리라 우선순위 1번입니다.</p>
  </section>

  <section>
    <div class="sh"><h2><span>07</span>키워드 전체</h2>
      <p>키워드 · 컨셉 · 고민·성분으로 검색되며, 열 제목을 누르면 정렬됩니다</p></div>
    <div class="tbar">
      <div class="search ${q?'has':''}" id="sbox">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="sinput" type="search" placeholder="예: 약산성, 맥주효모, 앰플, 쿨링" value="${esc(q)}"
          autocomplete="off" aria-label="키워드 검색">
        <button class="clr" id="sclr" aria-label="검색어 지우기">×</button>
      </div>
      <div class="segs" id="segs">${['B','A','C','D','ALL'].map(x=>`<button data-q="${x}" aria-pressed="${qf===x}">${x==='ALL'?'전체':QN[x]}</button>`).join('')}</div>
      <span class="cnt" id="tcnt"></span>
    </div>
    <p class="ovfhint" id="thint"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>표를 <b>옆으로 밀면</b> 상품수 · CTR · 광고단가 · 기회점수가 더 있습니다</p>
    <div id="tbody"></div>
  </section>

  <section>
    <div class="sh"><h2><span>08</span>무엇을 할 것인가</h2></div>
    <div class="verdict ${ins.warn?'warn':''}"><span class="pill ${ins.rank==='1순위'?'good':(ins.rank==='보류'?'bad':(ins.rank==='인증 시 진입'?'warn':'ok'))}" style="margin-right:9px;vertical-align:2px">${ins.rank}</span>${ins.verdict}</div>
    <div class="two-ins">
      <div class="ic"><h3>상품 기획·소싱</h3><p class="role">어떤 상품을 넣을지</p>
        <ul>${ins.md.map(([a,b])=>`<li>${a}<em>${b}</em></li>`).join('')}</ul></div>
      <div class="ic"><h3>마케팅·광고</h3><p class="role">어디에 예산을 쓸지</p>
        <ul>${ins.mk.map(([a,b])=>`<li>${a}<em>${b}</em></li>`).join('')}</ul></div>
    </div>
  </section>

  <section>
    <details class="cav"><summary>이 수치를 믿기 전에 — 한계 7가지</summary>
      <div class="cavbody"><ol>
        <li><b>규제·기능성 분류는 참고용입니다.</b> 키워드 문자열로 기계적으로 나눈 것이라, 실제 상품명·광고 표현이 허용되는지는 법무 검토와 광고 자율심의로 확인하셔야 합니다. 기능성으로 잡힌 키워드 중에도 표현 방식에 따라 인증 없이 쓸 수 있는 경우가 있고, 반대로 여기서 안 잡힌 표현이 문제가 될 수도 있습니다.</li>
        <li><b>브랜드 판별은 어휘 사전 기반입니다.</b> 뷰티 브랜드는 수백 개라 목록으로는 잡을 수 없어서, 일반 어휘(제형·고민·성분·대상·용도)로만 이루어진 키워드를 &lsquo;일반&rsquo;으로 보고 나머지를 브랜드로 분류했습니다. 사전에 없는 신성분이나 신조어는 브랜드로 잘못 분류될 수 있습니다.</li>
        <li><b>브랜드 비중은 착시가 아닙니다.</b> 1위 키워드를 빼도 비중이 거의 그대로일 만큼 수요가 여러 브랜드에 넓게 퍼져 있습니다. 다만 브랜드별 점유율 순위는 상위 500개만으로는 낼 수 없어 넣지 않았습니다.</li>
        <li><b>카테고리당 상위 500개 키워드입니다.</b> 롱테일이 잘려 있어 실제 시장은 더 넓고, 잘린 지점이 카테고리마다 달라 카테고리 간 검색량 절대 비교는 조심해야 합니다. 세 헤어 카테고리(샴푸·탈모케어·두피케어)는 헤어케어와 키워드가 겹칩니다.</li>
        <li><b>2026년 8월 한 달 스냅샷입니다.</b> 선케어는 성수기 끝자락, 탈모는 가을 성수기 직전이라 계절 영향이 섞여 있습니다. 추세는 알 수 없습니다.</li>
        <li><b>CPC는 실제 지불액이 아니라</b> &ldquo;최하위 노출 광고의 최고입찰가&rdquo;입니다. 광고 슬롯 하단의 최소 비용에 가깝습니다.</li>
        <li><b>매출·전환율·가격·리뷰 데이터가 없습니다.</b> 뷰티는 리뷰 수가 순위를 좌우하는 카테고리라, 경쟁강도가 낮아도 1페이지가 리뷰 수천 개로 막혀 있을 수 있습니다.</li>
      </ol>
      <p class="formula">기회점수 = 0.40×수요(검색량 백분위) + 0.40×공급부족(상품수 백분위 역순) + 0.20×반응(모바일 CTR 백분위), 진입 가능 키워드 안에서 카테고리별 백분위로 계산해 10점 환산. 묶음 카드(성분·제형·대상·용도)의 경쟁강도는 하위 항목 상품수 합 ÷ 검색수 합입니다.</p>
      </div></details>
  </section>`;

  const checkOvf=()=>{
    [['pwrap','phint','pscroll'],['twrap','thint','ts']].forEach(([w,hn,inner])=>{
      const el=document.getElementById(w),hint=document.getElementById(hn);
      if(!el||!hint) return;
      const sc=el.querySelector('.'+inner);
      const over=sc && sc.scrollWidth>sc.clientWidth+4;
      el.classList.toggle('ovf',!!over); hint.classList.toggle('on',!!over);
      if(sc && !sc.dataset.bound){sc.dataset.bound='1';
        sc.addEventListener('scroll',()=>{
          const end=sc.scrollLeft+sc.clientWidth>=sc.scrollWidth-6;
          el.classList.toggle('ovf',!end); hint.classList.toggle('on',!end);});}
    });};
  window.__checkOvf=checkOvf;
  refreshPaths();
  document.getElementById('psegs').onclick=e=>{const b=e.target.closest('button');
    if(b){pv=b.dataset.p;[...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed',x===b));refreshPaths();}};

  refreshTable();
  document.getElementById('segs').onclick=e=>{const b=e.target.closest('button');
    if(b){qf=b.dataset.q;[...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed',x===b));refreshTable();}};
  const si=document.getElementById('sinput'),sb=document.getElementById('sbox');
  si.addEventListener('input',()=>{q=si.value;sb.classList.toggle('has',!!q);refreshTable();});
  si.addEventListener('keydown',e=>{if(e.key==='Escape'){q='';si.value='';sb.classList.remove('has');refreshTable();}});
  document.getElementById('sclr').onclick=()=>{q='';si.value='';sb.classList.remove('has');refreshTable();si.focus();};

  const box=document.getElementById('mapbox'),tip=document.getElementById('tip');
  box.addEventListener('mousemove',e=>{
    const c=e.target.closest('.dot');
    if(!c){tip.style.opacity=0;return;}
    const o=c.dataset,r=box.getBoundingClientRect();
    tip.innerHTML=`<b>${o.k}</b>검색 ${o.s} · 상품 ${o.p}<br>경쟁강도 ${o.c} · CTR ${o.m}%<br>광고단가 ${o.a}원<br><span style="opacity:.65">${o.q} · ${o.n}</span>`;
    tip.style.opacity=1;
    let x=e.clientX-r.left+16,y=e.clientY-r.top+16;
    if(x>r.width-262)x=e.clientX-r.left-256;
    if(y>r.height-124)y=e.clientY-r.top-124;
    tip.style.left=x+'px';tip.style.top=y+'px';});
  box.addEventListener('mouseleave',()=>tip.style.opacity=0);
  setTimeout(checkOvf,0); window.addEventListener('resize',checkOvf);
}

const tabsEl=document.getElementById('tabs');
const tabBtns=[];
cats.forEach(c=>{const b=document.createElement('button');
  b.setAttribute('role','tab');
  b.innerHTML=c+'<i>'+DATA[c].sum.n+'</i>';
  b.onclick=()=>{cur=c;qf='B';sk='sc';sd=-1;q='';pv='md';renderTop();render();};
  tabsEl.appendChild(b); tabBtns.push(b);});
renderTop();
render();
</script>
</body>
</html>
